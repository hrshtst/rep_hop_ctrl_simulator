[project]
name = "rhc-demo"
version = "0.1.0"
description = "PyQt6 demo of the dynamics-morphing hopping controller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rhc",
    "pyqt6>=6.6",
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.scripts]
rhc-demo = "rhc_demo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhc_demo"]

[tool.uv.sources]
rhc = { workspace = true }
