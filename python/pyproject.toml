[tool.uv.workspace]
members = ["rhc", "app"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["rhc/src", "rhc/tests", "app/src", "app/tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1",      # not every public symbol needs a docstring
    "COM812",  # conflicts with the formatter
    "ISC001",  # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D", "ANN", "PLR2004", "INP001", "PT011", "ERA001"]
"**/__main__.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
