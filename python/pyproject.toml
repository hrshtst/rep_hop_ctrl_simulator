[tool.uv.workspace]
members = ["rhc", "app"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["rhc/src", "rhc/tests", "app/src", "app/tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1",      # not every public symbol needs a docstring
    "COM812",  # conflicts with the formatter
    "ISC001",  # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests may print (visible with -s) and defer Qt imports until after the
# offscreen platform is configured.
"**/tests/**" = ["S101", "D", "ANN", "PLR2004", "PLR0913", "INP001", "PT011", "ERA001", "SLF001", "ARG001", "ARG005", "PLC0415", "T201"]
# GUI source: allow Qt naming/idioms (mixedCase signals, slot overrides,
# widget constructors with many params, signal-forwarding lambdas, Greek
# symbols in labels, positional-bool slots/setters, and deferred Qt
# imports in the entry point).
"**/rhc_demo/**" = ["N802", "N815", "PLR0913", "PLW0108", "RUF001", "PLC0415", "ARG001", "ANN001", "FBT001", "FBT002"]
"**/__main__.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
